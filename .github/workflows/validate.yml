name: Validate application

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Design-system check
        run: npm run check:design
      - name: Test hospital CSV converter
        run: npm run test:hospitals:csv
      - name: Test nearby distance calculations
        run: npm run test:nearby:distance
      - name: Build Next.js application
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser accessibility and interaction tests
        run: npm run test:a11y
